<!DOCTYPE html>
<html lang="es">

<head>

    <link rel="icon" href="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/6.png" type="image/x-icon">
    <link rel="stylesheet" href="../css/game.css">
</head>

<body>

        <button id="back-button" class="back-button" aria-label="Volver"> < </button>
